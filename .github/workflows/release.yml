name: Build and Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:   # ручной запуск

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # даём права на создание релизов
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        cache: false

    - name: Tidy dependencies
      run: go mod tidy
      working-directory: ./mail-bot

    - name: Build binary for Linux amd64
      run: |
        cd mail-bot
        GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o imap2tg_go-linux-amd64 cmd/mail-bot/main.go

    - name: Create/Update latest release
      uses: ncipollo/release-action@v1
      with:
        tag: latest
        name: "Latest release (auto-built from main)"
        body: "Это последняя сборка из ветки `main`. Обновляется при каждом пуше.\n\nСкачайте бинарник для Linux x86_64."
        artifacts: mail-bot/imap2tg_go-linux-amd64
        allowUpdates: true
        replacesArtifacts: true
        draft: false
        prerelease: false
        token: ${{ secrets.GITHUB_TOKEN }}