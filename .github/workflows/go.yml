name: CI для imap2tg_go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        cache: false  # отключаем кеш, чтобы избежать проблем с go.sum

    - name: Tidy and download dependencies
      run: go mod tidy
      working-directory: ./mail-bot

    - name: Build
      run: go build -v ./...
      working-directory: ./mail-bot

    - name: Run tests with race detector
      run: go test -race -coverprofile=coverage.txt -covermode=atomic ./...
      working-directory: ./mail-bot

    - name: Publish coverage report
      uses: gwatts/go-coverage-action@v2
      id: coverage
      with:
        cover-pkg: ./...
        cover-file: ./mail-bot/coverage.txt

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: TSergeymsk/imap2tg_go
        files: ./mail-bot/coverage.txt