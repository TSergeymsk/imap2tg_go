# .github/workflows/go.yml
name: CI для imap2tg_go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
    # 1. Загружаем код из репозитория
    - uses: actions/checkout@v4

    # 2. Устанавливаем Go
    - name: Установка Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'  # Используем версию из вашего go.mod[reference:1][reference:2]

    # 3. Скачиваем зависимости
    - name: Загрузка зависимостей
      run: go mod download

    # 4. Запускаем тесты с проверкой на гонки (race detector) и записью покрытия
    - name: Запуск тестов
      run: go test -race -coverprofile=coverage.txt -covermode=atomic ./...

    # 5. Собираем проект
    - name: Сборка
      run: go build -v ./...

    # 6. (Опционально) Публикуем отчёт о покрытии в GitHub
    - name: Публикация отчёта о покрытии
      uses: gwatts/go-coverage-action@v2
      id: coverage
      with:
        cover-pkg: ./...  # Собираем покрытие для всех пакетов[reference:3]
        # report-url: https://ваш-сайт/отчёты  # Если хотите выгружать HTML-отчёт

    # 7. (Опционально) Отправляем результаты в Codecov для красивого отображения
    - name: Отправка в Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}  # Токен нужно создать в настройках репозитория[reference:4]
        slug: TSergeymsk/imap2tg_go
        files: ./coverage.txt
