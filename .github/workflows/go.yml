name: CI для imap2tg_go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        cache: false  # отключаем кеш для простоты

    - name: Tidy dependencies
      run: go mod tidy
      working-directory: ./mail-bot

    - name: Build
      run: go build -v ./...
      working-directory: ./mail-bot

    - name: Run tests
      run: go test -race ./...
      working-directory: ./mail-bot